<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DevLens lets you search GitHub users and view their profiles and repositories." />
    <title>DevLens</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1><i class="fab fa-github"></i> DevLens</h1>
        <p>Search for a GitHub user and explore their profile and repositories.</p>
      </header>

      <form class="search-container" id="search-form">
        <label class="sr-only" for="search">GitHub username</label>
        <input id="search" type="text" placeholder="Enter a GitHub username..." autocomplete="off" />
        <button id="search-btn" type="submit"><i class="fas fa-search"></i> Search</button>
      </form>

      <div class="history-container" id="history-container" aria-label="Recent searches"></div>
      <p id="loading" class="message hidden" aria-live="polite">Loading...</p>

      <section id="profile-container" class="hidden" aria-live="polite">
        <div class="profile-card">
          <div class="profile-header">
            <img id="avatar" src="" alt="" />
            <div class="profile-info">
              <h2 id="name"></h2>
              <p id="username"></p>
              <p id="bio" class="bio hidden"></p>
            </div>
          </div>
          <div class="stats">
            <div class="stat"><i class="fas fa-users"></i><span><strong id="followers"></strong> Followers</span></div>
            <div class="stat"><i class="fas fa-user-check"></i><span><strong id="following"></strong> Following</span></div>
            <div class="stat"><i class="fas fa-book"></i><span><strong id="repos"></strong> Public repos</span></div>
          </div>
        </div>

        <section class="repos-section">
          <h3>Repositories</h3>
          <div id="repos-container" class="repos-container"></div>
        </section>
      </section>

      <div id="error-container" class="error-card hidden" role="alert">
        <i class="fas fa-circle-xmark error-icon"></i>
        <p id="error-message" class="error-message"></p>
      </div>
    </main>
    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
